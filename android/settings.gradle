pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings")
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0' }
// If `nodeBinary` is set in ~/.gradle/gradle.properties (used to handle
// Android Studio launching with a stripped PATH that excludes Homebrew), invoke
// the RN CLI directly via that node binary instead of relying on `npx` being on
// PATH. Falls back to the default `npx @react-native-community/cli config` when
// no override is supplied.
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    def nodeBinary = settings.providers.gradleProperty("nodeBinary").getOrNull()
    if (nodeBinary) {
        ex.autolinkLibrariesFromCommand([
            nodeBinary as String,
            "node_modules/@react-native-community/cli/build/bin.js",
            "config",
        ])
    } else {
        ex.autolinkLibrariesFromCommand()
    }
}
rootProject.name = 'MyTubeAndroid'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
